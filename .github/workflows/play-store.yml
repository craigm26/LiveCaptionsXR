name: Deploy to Google Play

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]

permissions:
  contents: read

jobs:
  deploy:
    name: Upload to Google Play
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/app/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Decode Service Account JSON
        run: |
          # Secret may be stored as base64 or raw JSON
          RAW="${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}"
          if echo "$RAW" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
            echo "$RAW" > /tmp/play-sa.json
          else
            echo "$RAW" | base64 -d > /tmp/play-sa.json
          fi

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: /tmp/play-sa.json
          packageName: com.livecaptionsxr.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: draft
          whatsNewDirectory: distribution/whatsnew
