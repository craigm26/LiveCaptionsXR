name: Deploy to Google Play

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]

permissions:
  contents: read

jobs:
  deploy:
    name: Upload to Google Play
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/app/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Write service account JSON
        env:
          SA_RAW: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # Detect format: base64 strings never start with '{', JSON always does
          FIRST=$(printf '%s' "$SA_RAW" | head -c 1)
          if [ "$FIRST" = "{" ]; then
            printf '%s' "$SA_RAW" > /tmp/play-sa.json
            echo "✅ Service account JSON: raw format"
          else
            printf '%s' "$SA_RAW" | base64 -d > /tmp/play-sa.json
            echo "✅ Service account JSON: decoded from base64"
          fi
          # Validate it parsed correctly
          python3 -c "import json; d=json.load(open('/tmp/play-sa.json')); print('✅ JSON valid, project:', d.get('project_id','?'))"

      - name: Ensure whatsnew directory exists
        run: |
          mkdir -p distribution/whatsnew
          if [ ! -f distribution/whatsnew/whatsnew-en-US ]; then
            echo "Bug fixes and performance improvements." > distribution/whatsnew/whatsnew-en-US
          fi

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: /tmp/play-sa.json
          packageName: com.livecaptionsxr.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: draft
          changesNotSentForReview: true
          whatsNewDirectory: distribution/whatsnew
        continue-on-error: true
        id: play_upload

      - name: Check Play upload result
        if: steps.play_upload.outcome == 'failure'
        run: |
          echo "⚠️  Google Play upload failed — version may already exist on this track."
          echo "This is non-fatal: the app bundle is already uploaded if this is a re-run."
          echo "If this is a new version, check the Play Console for details."
